<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银河麒麟智能安全运维 Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; }
        .container { max-width: 760px; width: 92%; padding: 40px; }
        h1 { text-align: center; font-size: 2em; margin-bottom: 10px; background: linear-gradient(90deg, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { text-align: center; color: #8892b0; margin-bottom: 40px; font-size: 0.9em; }
        .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 20px; }
        @media (max-width: 500px) { .card-grid { grid-template-columns: 1fr; } }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; text-decoration: none; color: #fff; transition: all 0.3s; cursor: pointer; display: block; position: relative; }
        .card:hover { background: rgba(255,255,255,0.1); transform: translateY(-4px); border-color: #3a7bd5; box-shadow: 0 8px 32px rgba(58,123,213,0.2); }
        .card-icon { font-size: 2em; margin-bottom: 8px; }
        .card-title { font-size: 1.05em; font-weight: 600; margin-bottom: 6px; }
        .card-desc { font-size: 0.82em; color: #8892b0; line-height: 1.5; }
        .card-badge { position: absolute; top: 12px; right: 12px; font-size: 0.7em; padding: 2px 8px; border-radius: 10px; }
        .card-badge.primary { background: rgba(58,123,213,0.3); color: #7bb8ff; }
        .card-badge.success { background: rgba(74,222,128,0.2); color: #4ade80; }
        .status-bar { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-top: 24px; padding: 14px; background: rgba(255,255,255,0.03); border-radius: 8px; font-size: 0.85em; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-dot.green { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
        .status-dot.yellow { background: #facc15; box-shadow: 0 0 6px #facc15; }
        .status-dot.red { background: #f87171; box-shadow: 0 0 6px #f87171; }
        .footer { text-align: center; margin-top: 24px; color: #4a5568; font-size: 0.8em; }
        .footer code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ 银河麒麟智能安全运维 Agent</h1>
        <p class="subtitle">LoongArch · 龙架构 · V10 SP1</p>

        <div class="card-grid">
            <a class="card" href="http://127.0.0.1:8900/" target="_blank">
                <span class="card-badge primary">主入口</span>
                <div class="card-icon">🖥️</div>
                <div class="card-title">Web 控制台</div>
                <div class="card-desc">Vue 前端主界面：智能对话 · 仪表盘 · 安全扫描 · 报告查看</div>
            </a>

            <a class="card" href="http://127.0.0.1:8900/docs" target="_blank">
                <div class="card-icon">📄</div>
                <div class="card-title">API 文档</div>
                <div class="card-desc">Swagger 交互式接口文档，在线测试 API</div>
            </a>

            <a class="card" onclick="window.location.reload()">
                <div class="card-icon">🔄</div>
                <div class="card-title">刷新状态</div>
                <div class="card-desc">重新检测各服务连接状态</div>
            </a>
        </div>

        <div class="status-bar">
            <span id="api-status"><span class="status-dot yellow"></span>API: 检测中...</span>
            <span id="frontend-status"><span class="status-dot yellow"></span>前端: 检测中...</span>
        </div>

        <p class="footer">启动: <code>bash boot_start.sh</code> · 停止: <code>bash boot_stop.sh</code></p>
    </div>

    <script>
        async function checkStatus() {
            const apiEl = document.getElementById('api-status');
            const frontendEl = document.getElementById('frontend-status');
            try {
                await fetch('http://127.0.0.1:8900/api/health', { mode: 'no-cors', signal: AbortSignal.timeout(3000) });
                apiEl.innerHTML = '<span class="status-dot green"></span>API: 运行中';
            } catch {
                apiEl.innerHTML = '<span class="status-dot red"></span>API: 未连接';
            }

            try {
                await fetch('http://127.0.0.1:8900/', { mode: 'no-cors', signal: AbortSignal.timeout(3000) });
                frontendEl.innerHTML = '<span class="status-dot green"></span>前端: 运行中';
            } catch {
                frontendEl.innerHTML = '<span class="status-dot red"></span>前端: 未连接';
            }

        }
        checkStatus();
    </script>
</body>
</html>
