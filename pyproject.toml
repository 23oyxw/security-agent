[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-agent"
version = "0.7.0"
description = "银河麒麟智能安全运维 Agent — 多维感知 + 推理决策 + 安全控制"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # --- 原有依赖 ---
    "httpx>=0.28.1",
    "mcp>=1.27.1",
    "openai>=2.37.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
    "plotly>=6.0.0",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.2",
    "streamlit>=1.57.0",
    # --- 新增: FastAPI 后端 ---
    "fastapi>=0.115.0",
    # 不用 [standard]：龙架构/麒麟 KYSEC 下 uvloop/httptools 常无 wheel 且编译被拦
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.18",
    # --- 新增: 认证 ---
    "PyJWT>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    # --- 新增: WebSocket ---
    "websockets>=15.0",
    "pyyaml>=6.0.3",
    # --- 新增: API 限流 + 熔断重试 ---
    "slowapi>=0.1.9",
    "tenacity>=8.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["security_agent*", "ui*"]

[tool.uv]
package = false
