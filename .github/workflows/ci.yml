name: CI — Benchmark + Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # 手动触发

jobs:
  test:
    name: "Python ${{ matrix.python-version }} · ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # pyyaml 独立安装确保 test_skill_flows 等能跑
          pip install pyyaml

      - name: Create data dirs
        run: |
          mkdir -p data/logs data/alerts data/traces data/wiki_export

      - name: Version check
        run: python scripts/check_version.py

      - name: Run v0.9 suites (benchmark)
        run: python scripts/benchmark.py
        timeout-minutes: 15

      - name: Run core test suites
        run: |
          python -m pytest tests/ \
            -x --timeout=60 --tb=short \
            -k "not (e2e or api_smoke or kylin or loongarch)" \
            --ignore=tests/segment_tests.py \
            -v 2>&1 | head -200
        timeout-minutes: 10
        continue-on-error: true

      - name: Store benchmark history
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-history-${{ runner.os }}-py${{ matrix.python-version }}
          path: data/benchmark_history.jsonl
          retention-days: 30

      - name: Store test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failure-log-${{ runner.os }}-py${{ matrix.python-version }}
          path: |
            /tmp/*.log
            data/logs/*.log
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "## CI Result" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| OS | ${{ runner.os }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | ${{ matrix.python-version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Job | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
